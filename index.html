<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>세계여행 브루마블</title>
<meta name="theme-color" content="#3DBBFF" />
<meta name="description" content="아이와 부모가 함께 즐기는 세계 나라·수도·국기 보드게임" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/piece.css" />
<link rel="stylesheet" href="css/board.css" />
<link rel="stylesheet" href="css/game.css" />
<link rel="stylesheet" href="css/mobile.css" />
<link rel="stylesheet" href="css/tablet.css" />
</head>
<body>
<div id="app">

  <!-- ========== 인트로 영상 ========== -->
  <section id="screen-intro" class="screen">
    <video id="intro-video" class="intro-video" playsinline autoplay muted preload="auto"
           poster="assets/intro/intro-poster.jpg">
      <source src="assets/intro/intro.mp4" type="video/mp4" />
    </video>
    <button id="intro-sound" class="intro-sound-btn">
      <span class="intro-sound-icon">🔊</span>
      <span class="intro-sound-text">소리 켜기</span>
    </button>
    <button id="intro-skip" class="intro-skip-btn hidden">건너뛰기 ⏭</button>
  </section>

  <!-- ========== 시작 화면 ========== -->
  <section id="screen-start" class="screen hidden">
    <button id="btn-settings" class="corner-btn" title="소리·애니메이션 설정" aria-label="설정">⚙️</button>
    <div class="start-globe">🌎</div>
    <h1 class="start-title">세계여행 브루마블</h1>
    <p class="start-subtitle"><b class="l1">🎲 나라를 여행하고</b><br /><b class="l2">🌍 세계를 배워요!</b></p>
    <div class="start-actions">
      <button id="btn-new-game" class="btn btn-primary btn-block">새 게임</button>
      <button id="btn-continue" class="btn btn-secondary btn-block">이어하기</button>
      <button id="btn-collection" class="btn btn-secondary btn-block">🧳 여행 도감</button>
      <button id="btn-how-to-play" class="btn btn-secondary btn-block">게임 방법</button>
    </div>
  </section>

  <!-- ========== 플레이어 설정 화면 ========== -->
  <section id="screen-setup" class="screen hidden">
    <div class="setup-card">
      <h2 class="setup-title">👨‍👩‍👧 함께할 사람 수</h2>
      <div class="player-count-row">
        <button class="count-chip active" data-count="2">2</button>
        <button class="count-chip" data-count="3">3</button>
        <button class="count-chip" data-count="4">4</button>
      </div>
      <div id="player-form-list"></div>

      <div class="setup-option">
        <span class="setup-option-label">💰 시작 자금</span>
        <div class="option-chip-row" data-group="money">
          <button type="button" class="option-chip" data-value="200">200만원</button>
          <button type="button" class="option-chip active" data-value="300">300만원</button>
          <button type="button" class="option-chip" data-value="400">400만원</button>
        </div>
      </div>
      <div class="setup-option">
        <span class="setup-option-label">🎲 게임 길이</span>
        <div class="option-chip-row" data-group="turns">
          <button type="button" class="option-chip" data-value="16">16턴</button>
          <button type="button" class="option-chip active" data-value="24">24턴</button>
          <button type="button" class="option-chip" data-value="32">32턴</button>
          <button type="button" class="option-chip" data-value="0">파산까지</button>
        </div>
      </div>

      <button id="btn-start-playing" class="btn btn-primary btn-block">시작하기</button>
      <button id="btn-back-to-start" class="btn btn-secondary btn-block">뒤로</button>
    </div>
  </section>

  <!-- ========== 게임 화면 ========== -->
  <section id="screen-game" class="screen hidden">
    <div id="board-wrapper">
      <div id="board" class="board"></div>
      <div id="dice-stage" class="dice-stage hidden">
        <div class="ds-card">
          <div id="dice-stage-turn" class="ds-turn"></div>
          <button type="button" id="dice-stage-btn" class="ds-btn">
            <span id="dice-stage-die" class="dice-stage-die">🎲</span>
            <span id="dice-stage-num" class="dice-stage-num"></span>
          </button>
          <div id="dice-stage-hint" class="ds-hint"></div>
        </div>
      </div>
    </div>

    <aside id="game-side">
      <div class="game-topbar">
        <div id="turn-indicator" class="turn-indicator"></div>
        <div class="topbar-right">
          <div id="turn-counter" class="turn-counter"></div>
          <button id="btn-open-collection" class="topbar-icon-btn" title="여행 도감">🧳</button>
          <button id="btn-open-settings-game" class="topbar-icon-btn" title="소리·애니메이션 설정" aria-label="설정">⚙️</button>
          <button id="btn-exit-game" class="topbar-icon-btn" title="처음 화면으로" aria-label="처음으로">🏠</button>
        </div>
      </div>

      <div id="player-panel" class="player-panel"></div>
    </aside>
  </section>

  <!-- ========== 여행 도감 화면 ========== -->
  <section id="screen-collection" class="screen hidden">
    <div class="collection-header">
      <h1 class="start-title">🧳 여행 도감</h1>
      <p id="collection-progress" class="collection-progress"></p>
    </div>
    <div id="collection-grid" class="collection-grid"></div>
    <button id="btn-collection-back" class="btn btn-secondary btn-block" style="margin-top:14px">뒤로</button>
  </section>

  <!-- ========== 결과 화면 ========== -->
  <section id="screen-result" class="screen hidden">
    <div class="start-globe">🏆</div>
    <h1 class="start-title">세계여행 종료!</h1>
    <div id="result-list" class="result-list"></div>
    <button id="btn-play-again" class="btn btn-primary btn-block" style="margin-top:12px">처음으로</button>
  </section>

</div>

<!-- ========== 임팩트 연출 레이어 ========== -->
<div id="fx-layer" class="fx-layer hidden" aria-hidden="true"></div>

<!-- ========== 공용 모달 ========== -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-content" class="modal-content"></div>
</div>

<!-- 데이터 -->
<script src="data/countries.js"></script>
<script src="data/pieces.js"></script>
<script src="data/events.js"></script>
<script src="data/quizzes.js"></script>

<!-- 엔진 -->
<script src="js/country.js"></script>
<script src="js/piece.js"></script>
<script src="js/player.js"></script>
<script src="js/board.js"></script>
<script src="js/dice.js"></script>
<script src="js/property.js"></script>
<script src="js/quiz.js"></script>
<script src="js/event.js"></script>
<script src="js/ai.js"></script>
<script src="js/settings.js"></script>
<script src="js/sound.js"></script>
<script src="js/storage.js"></script>
<script src="js/game.js"></script>

<!-- 화면 -->
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/intro.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((err) => {
        console.warn("서비스워커 등록 실패(파일을 file://로 직접 열면 정상, http(s) 서버에서는 자동 등록):", err);
      });
    });
  }
</script>
</body>
</html>
